<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Down Energy</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:20px;
    width:95%;
    max-width:500px;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
    text-align:center;
}

h2{
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    outline:none;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,#25D366,#128C7E);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

.hidden{
    display:none;
}

.spinner{
    margin:20px auto;
    width:40px;
    height:40px;
    border:4px solid #fff;
    border-top:4px solid #25D366;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{ transform:rotate(360deg);}
}

.success{
    font-size:20px;
    color:#25D366;
    margin-bottom:20px;
}

.final-msg{
    font-size:28px;
    font-weight:700;
    color:#ffcc00;
    animation: piscar 1s infinite alternate;
}

@keyframes piscar{
    from{opacity:0.6;}
    to{opacity:1;}
}
</style>
</head>
<body>

<div class="container">

    <!-- ETAPA 1 -->
    <div id="etapa1">
        <h2>Cadastro de Compra</h2>
        <input type="text" placeholder="Nome completo" required>
        <input type="text" placeholder="CPF" required>
        <input type="text" placeholder="Endereço" required>
        <input type="text" placeholder="Número da casa" required>
        <button onclick="irParaUpload()">Confirmar</button>
    </div>

    <!-- ETAPA 2 -->
    <div id="etapa2" class="hidden">
        <h2>Envie sua conta de luz</h2>
        <input type="file" accept="image/*">
        <button onclick="analisar()">Enviar para análise</button>
    </div>

    <!-- ETAPA 3 -->
    <div id="etapa3" class="hidden">
        <h2>Analisando documento...</h2>
        <div class="spinner"></div>
        <p>Estamos verificando sua conta.</p>
    </div>

    <!-- ETAPA 4 -->
    <div id="etapa4" class="hidden">
        <div class="success">
            ✔ Documento enviado com sucesso!
        </div>
        <h2>Forma de pagamento</h2>
        <select>
            <option>Escolha uma opção</option>
            <option>Pix</option>
            <option>Cartão de Crédito</option>
        </select>
        <button onclick="finalizar()">Finalizar Compra</button>
    </div>

    <!-- ETAPA FINAL -->
    <div id="etapaFinal" class="hidden">
        <div class="final-msg">
            to apaixonado num cabelo vermelho
        </div>
    </div>

</div>

<script>
function irParaUpload(){
    document.getElementById("etapa1").classList.add("hidden");
    document.getElementById("etapa2").classList.remove("hidden");
}

function analisar(){
    document.getElementById("etapa2").classList.add("hidden");
    document.getElementById("etapa3").classList.remove("hidden");

    setTimeout(()=>{
        document.getElementById("etapa3").classList.add("hidden");
        document.getElementById("etapa4").classList.remove("hidden");
    }, 5000);
}

function finalizar(){
    document.getElementById("etapa4").classList.add("hidden");
    document.getElementById("etapaFinal").classList.remove("hidden");
}
</script>

</body>
</html>
